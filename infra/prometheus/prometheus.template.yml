global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 2s

scrape_configs:
  - job_name: corekv-server-node
    static_configs:
      - targets: ["__SERVER_PRIVATE_IP__:9100"]
        labels:
          role: server

  - job_name: corekv-loadgen-node
    static_configs:
      - targets: ["__LOADGEN_PRIVATE_IP__:9100"]
        labels:
          role: loadgen

  - job_name: corekv-bench
    static_configs:
      - targets: ["__LOADGEN_PRIVATE_IP__:9091"]
        labels:
          role: loadgen

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]